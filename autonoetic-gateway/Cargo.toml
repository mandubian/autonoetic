[package]
name = "autonoetic-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Enables `reset_constitution_runtime_for_tests` (dependency crates can enable under `cfg(test)` only).
test-utils = []
# Portable WASM execution tier (RFC docs/rfc/portable-wasm-execution-tier.md, P4).
# Off by default — the native build doesn't pay wasmtime's compile/binary cost.
wasm-tier = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
autonoetic-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
axum.workspace = true
tower-http.workspace = true
secrecy = "0.10.3"
reqwest = { version = "0.13.2", features = ["json", "stream", "blocking"] }
uuid = { version = "1.21.0", features = ["v4"] }
walkdir = "2"
chrono = "0.4.44"
async-trait = "0.1.89"
gray_matter = "0.3.2"
ed25519-dalek = "2.2.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
toml = "0.8"
base64 = "0.22.1"
futures = "0.3.32"
autonoetic-ofp = { version = "0.1.0", path = "../autonoetic-ofp" }
autonoetic-mcp = { version = "0.1.0", path = "../autonoetic-mcp" }
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6.1"
hex = "0.4.3"
url = "2.5"
regex = "1.11.2"
libc = "0.2"
tar = "0.4"
zstd = "0.13"
tempfile = "3.26.0"
aes-gcm = "0.10.3"
rand = "0.8"
wasmtime = { version = "45.0.1", optional = true }
wasmtime-wasi = { version = "45", optional = true }

[[bin]]
name = "mock-moltbook"
path = "src/bin/mock_moltbook.rs"

[dev-dependencies]
serial_test = "3.0"
proptest = "1.11.0"
