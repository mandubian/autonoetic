name: ci

# Per-PR gate: focused on global health, kept fast. Compilation + the
# in-process unit tests across every crate (~1.6k tests, parallel, no daemon
# spawning). The slow integration suites (autonoetic-gateway/tests/**, the
# cli_e2e chat tests) and the #[ignore]'d full-stack e2e run once a day in the
# `nightly` workflow instead — see .github/workflows/nightly.yml.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # mold: required by .cargo/config.toml's `-fuse-ld=mold` rustflag (#920).
      - run: sudo apt-get update && sudo apt-get install -y mold

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --workspace

  unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # mold: required by .cargo/config.toml's `-fuse-ld=mold` rustflag (#920).
      - run: sudo apt-get update && sudo apt-get install -y mold

      - uses: taiki-e/install-action@cargo-nextest

      - uses: Swatinem/rust-cache@v2

      # Unit tests only (lib + bin targets) — no daemons, no integration suites.
      # Serial (profile.ci): several gateway unit tests share process-global
      # state (router/server/trajectory) and must not run concurrently.
      # Integration tests in tests/ are intentionally excluded here; they run
      # in the daily `nightly` workflow.
      - run: cargo nextest run --workspace --lib --bins --profile ci

  # Integration-test compile gate (#921). PR CI skips *running* the 239
  # tests/ binaries for cost, but skipping *compiling* them let rot accumulate
  # on main unseen (#889's curator breakage; #918 shipped two broken test
  # targets past green CI). `cargo check --tests` type-checks every test
  # target but never produces the final test executables — no codegen for the
  # test targets themselves and none of the 239 executable links (build
  # scripts and proc macros are still compiled, as they must run). It catches
  # missing struct fields, signature drift, and syntax errors at a fraction
  # of the build cost (~45s cold on a standard runner). Runtime coverage
  # stays in nightly.
  check-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # mold: required by .cargo/config.toml's `-fuse-ld=mold` rustflag (#920).
      - run: sudo apt-get update && sudo apt-get install -y mold

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace --tests
