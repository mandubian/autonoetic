name: nightly

# Comprehensive health check, run once a day (and on demand). The per-PR `ci`
# workflow is kept fast (build + unit tests); the slow integration suites and
# the heavy #[ignore]'d full-stack e2e are exercised here so PRs stay snappy.
# A red nightly is a triage signal (assertion drift vs. real regression), not a
# merge blocker.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {} # manual trigger from the Actions tab

env:
  CARGO_TERM_COLOR: always

jobs:
  full-suite:
    runs-on: ubuntu-latest
    # Shard the full suite across two runners (#924). nextest's --partition
    # splits the test list deterministically; each runner executes its half
    # serially (profile.ci), preserving the historical --test-threads=1
    # semantics while halving wall-clock. Cross-runner interference is not
    # possible (separate machines).
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-nextest

      - uses: Swatinem/rust-cache@v2

      # bubblewrap is required by the sandbox integration tests and the
      # #[ignore]'d promotion-gate e2e (real offline-sandbox runs).
      # mold is required by .cargo/config.toml's `-fuse-ld=mold` rustflag (#920).
      - name: Install bubblewrap and mold
        run: sudo apt-get update && sudo apt-get install -y bubblewrap mold

      # Full suite incl. the integration tests in tests/. Serial per runner
      # (profile.ci) for state isolation (the integration tests use
      # serial_test / shared temp state); the two shards cover everything the
      # per-PR `unit` job skips.
      - name: Integration suite
        run: cargo nextest run --workspace --profile ci --partition count:${{ matrix.shard }}/2

      # Heavy #[ignore]'d e2e: full-stack chat (spawns gateway + LLM stub) and
      # bubblewrap sandbox runs. Run last so a drift here doesn't mask the
      # integration results above. Not partitioned — small count, and the
      # serial ordering is load-bearing for some of them.
      - name: Ignored e2e
        run: cargo nextest run --workspace --profile ci --run-ignored ignored-only

  # #1002 slice 6 (issue #1296) — the `allow_set` fleet validation. The DP-1
  # default flip made the gateway-asserted mount set the production shape, so
  # a nightly canary runs the sandbox-heavy suites on real bubblewrap plus the
  # DP-1 drift guard (config default must stay `allow_set`). A red here means
  # the strict mode is breaking or the default is drifting back to `legacy` —
  # both are exactly what this job exists to surface (RFC §9.6/§10).
  allow-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap and mold
        run: sudo apt-get update && sudo apt-get install -y bubblewrap mold

      # Real-bubblewrap allow_set composition tests (tests/event/allow_set.rs),
      # sandbox tier suites, the declared-mount resolver + approval surfaces,
      # and the egress domain the mount set eventually feeds.
      - name: Sandbox domains under allow_set
        run: cargo nextest run --workspace --profile ci -E 'test(sandbox) or test(allow_set) or test(declared_mount) or test(mount_grant) or test(host_fs)'

      # Ignored #[ignore]'d sandbox e2e (real offline-sandbox runs under the
      # default allow_set mode).
      - name: Ignored sandbox e2e
        run: cargo nextest run --workspace --profile ci --run-ignored ignored-only -E 'test(sandbox)'
