<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%" role="img" aria-label="One law over humans and AI agents: the constitution above, three bound powers inside the frame, and the served party outside it, owed but never bound.">
  <!--
    Autonoetic - One law over humans and AI agents.

    GENERATED. Edit the generator, not this file:
      docs/diagrams/generate.py  (writes both the dark and light variants)

    The claims this plate makes, and does not overstate:
      - ONE law over every party (the seal, Rule Zero).
      - EQUAL STANDING, not identical rights: the two figures are dimensioned
        to the same height because a clause binds a *seat*, not a species
        (P-2.20). Each party is bound by a different clause family - that
        asymmetry is the design, and it is what produces symmetry of standing.
      - INSIDE the frame are the parties that can be BOUND, because a seat
        exists through which to oblige them. The served party sits OUTSIDE it:
        owed, never bound, because no seat is theirs yet.
      - A community that CORRECTS ITSELF (the footer cycle).

    Every clause ID printed here is checked against the active constitution by
    docs_link_guard::tests::every_clause_id_in_a_diagram_resolves.
  -->
  <defs>
    <style>
      .bg       { fill: #ffffff; }
      .frame    { fill: none; stroke: #d8dee4; stroke-width: 1; }
      .card     { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .card-law { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.6; }
      .frame-law{ fill: none; stroke: #9a6700; stroke-width: 1.6; }
      .card-gw  { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.6; }
      .card-evo { fill: #f7f0ff; stroke: #6639ba; stroke-width: 1.5; }
      .card-srv { fill: #eefbf8; stroke: #0f6e5e; stroke-width: 1.5; stroke-dasharray: 7 4; }
      .chip     { fill: #faf5ff; stroke: #d8c0f5; stroke-width: 1; }

      .h1  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1f2328; }
      .h2  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2328; }
      .h3  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1f2328; }
      .dek { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #59636e; }
      .mono{ font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #24292f; }
      .tag { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.10em; }
      .dim { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 8.5px; letter-spacing: 0.06em; fill: #6e7781; }

      .fig-hum { fill: none; stroke: #a40e26; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .fig-ai  { fill: none; stroke: #0969da; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

      .dimline { stroke: #8c959f; stroke-width: 0.9; }
      .guide   { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 6 4; }

      .e-hum { fill: none; stroke: #a40e26; stroke-width: 1.5; }
      .e-ai  { fill: none; stroke: #0969da; stroke-width: 1.5; }
      .e-law { fill: none; stroke: #9a6700; stroke-width: 1.5; }
      .e-evo { fill: none; stroke: #6639ba; stroke-width: 1.4; }
      .e-srv { fill: none; stroke: #0f6e5e; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .e-run { fill: none; stroke: #59636e; stroke-width: 1.5; }
</style>
    <marker id="m-hum" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a40e26" /></marker>
    <marker id="m-ai"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0969da" /></marker>
    <marker id="m-law" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9a6700" /></marker>
    <marker id="m-evo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6639ba" /></marker>
    <marker id="m-srv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0f6e5e" /></marker>
    <marker id="m-run" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#59636e" /></marker>

  </defs>

  <rect width="100%" height="100%" class="bg" />

