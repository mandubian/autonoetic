  <circle cx="500" cy="150" r="55" fill="none" stroke="#9a6700" stroke-width="0.8" opacity="0.5" />
  <text x="500" y="138" text-anchor="middle" class="tag" fill="#9a6700">THE CONSTITUTION</text>
