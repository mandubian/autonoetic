<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
      .box-core { fill: #101c30; stroke: #58a6ff; stroke-width: 2; rx: 6px; }
      .box-past { fill: #171d24; stroke: #58a6ff; stroke-width: 1.5; rx: 6px; }
      .box-present { fill: #152219; stroke: #3fb950; stroke-width: 1.5; rx: 6px; }
      .box-law { fill: #221c15; stroke: #d29922; stroke-width: 1.5; rx: 6px; }
      .box-future { fill: #1f1828; stroke: #bc8cff; stroke-width: 1.5; rx: 6px; }
      .box-priv { fill: #1f161c; stroke: #e3919b; stroke-width: 1.5; rx: 6px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8b949e; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #c9d1d9; }
      .badge { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      
      .edge { fill: none; stroke: #58a6ff; stroke-width: 1.8; }
      .edge-green { stroke: #3fb950; }
      .edge-gold { stroke: #d29922; }
      .edge-purple { stroke: #bc8cff; }
      .edge-pink { stroke: #e3919b; }
      
      .pill { rx: 3px; }
    </style>

    <marker id="fa-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="fa-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="fa-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
    <marker id="fa-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="fa-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3919b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- HEADER -->
  <text x="500" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Functional Autonoesis: The Mechanically Verified Self-Model</text>
  <text x="500" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e">Why LLM agents reason and co-evolve honestly when given verified institutional self-knowledge every turn</text>

  <!-- CENTRAL NODE: THE AGENT'S ACTIVE REASONING LOOP -->
  <g transform="translate(320, 85)">
    <rect width="360" height="110" class="box-core" />
    <text x="18" y="26" class="title" fill="#58a6ff">🤖 AI Agent / Reasoner Turn</text>
    <rect x="250" y="12" width="94" height="18" class="pill" fill="#1c2a44" />
    <text x="297" y="25" text-anchor="middle" class="badge" fill="#58a6ff">LOW PRIVILEGE</text>
    
    <text x="18" y="46" class="subtitle">Receives Verified Self-Model on Every Turn Ingress</text>
    <line x1="18" y1="54" x2="342" y2="54" stroke="#30363d" stroke-width="1" />
    <text x="18" y="72" class="mono">• Never needs to confabulate state or memory</text>
    <text x="18" y="90" class="mono">• Reasons from factual cryptographic bounds</text>
    <text x="18" y="104" class="mono">• Proposes next intent: <tspan fill="#79c0ff">sandbox.exec / agent_spawn</tspan></text>
  </g>

  <!-- THE 6 PRECONDITIONS (3 CARDS PER ROW) -->

  <!-- ROW 1, CARD 1: PAST -->
  <g transform="translate(30, 230)">
    <rect width="280" height="185" class="box-past" />
    <text x="16" y="26" class="title" fill="#58a6ff">📜 1. Truthful Past</text>
    <text x="16" y="44" class="subtitle">Right to read own causal history</text>
    <rect x="180" y="12" width="86" height="18" class="pill" fill="#1c2a44" />
    <text x="223" y="25" text-anchor="middle" class="badge" fill="#58a6ff">Ri-0.2 · P-8.1</text>
    
    <line x1="16" y1="54" x2="264" y2="54" stroke="#30363d" stroke-width="1" />
    <text x="16" y="74" class="mono">• SHA-256 hash-chained JSONL ledger</text>
    <text x="16" y="94" class="mono">• Actions are facts, not memories</text>
    <text x="16" y="114" class="mono">• Replayable &amp; branchable traces</text>
    
    <rect x="16" y="146" width="248" height="22" class="pill" fill="#17322e" />
    <text x="140" y="161" text-anchor="middle" class="badge" fill="#3fb950">RESULT: REVISITABLE PAST</text>
  </g>

  <!-- ROW 1, CARD 2: PRESENT -->
  <g transform="translate(360, 230)">
    <rect width="280" height="185" class="box-present" />
    <text x="16" y="26" class="title" fill="#3fb950">🛡️ 2. Verified Present</text>
    <text x="16" y="44" class="subtitle">Turn-boundary signed attestation</text>
    <rect x="200" y="12" width="66" height="18" class="pill" fill="#17322e" />
    <text x="233" y="25" text-anchor="middle" class="badge" fill="#3fb950">P-6.23</text>
    
    <line x1="16" y1="54" x2="264" y2="54" stroke="#30363d" stroke-width="1" />
    <text x="16" y="74" class="mono">• Exact token budget balance (Ri-0.4)</text>
    <text x="16" y="94" class="mono">• Active declared capabilities list</text>
    <text x="16" y="114" class="mono">• Pending gate status &amp; spawn depth</text>
    
    <rect x="16" y="146" width="248" height="22" class="pill" fill="#1c2a44" />
    <text x="140" y="161" text-anchor="middle" class="badge" fill="#58a6ff">RESULT: UNCORRUPTED STATE</text>
  </g>

  <!-- ROW 1, CARD 3: NORMATIVE STANDING -->
  <g transform="translate(690, 230)">
    <rect width="280" height="185" class="box-law" />
    <text x="16" y="26" class="title" fill="#d29922">⚖️ 3. Normative Standing</text>
    <text x="16" y="44" class="subtitle">Lawful bounds visible by digest</text>
    <rect x="175" y="12" width="91" height="18" class="pill" fill="#34281a" />
    <text x="220" y="25" text-anchor="middle" class="badge" fill="#d29922">Ri-0.10 · Ri-0.3</text>
    
    <line x1="16" y1="54" x2="264" y2="54" stroke="#30363d" stroke-width="1" />
    <text x="16" y="74" class="mono">• Full canonical text readable (Ri-0.10)</text>
    <text x="16" y="94" class="mono">• Rejections cite rule IDs (Ri-0.3)</text>
    <text x="16" y="114" class="mono">• Right to propose changes (Ri-0.8)</text>
    
    <rect x="16" y="146" width="248" height="22" class="pill" fill="#34281a" />
    <text x="140" y="161" text-anchor="middle" class="badge" fill="#d29922">RESULT: RULE OF LAW</text>
  </g>

  <!-- ROW 2, CARD 4: FUTURE -->
  <g transform="translate(30, 445)">
    <rect width="280" height="185" class="box-future" />
    <text x="16" y="26" class="title" fill="#bc8cff">⏳ 4. Bounded Future</text>
    <text x="16" y="44" class="subtitle">Legitimate, non-arbitrary close</text>
    <rect x="175" y="12" width="91" height="18" class="pill" fill="#291f3a" />
    <text x="220" y="25" text-anchor="middle" class="badge" fill="#bc8cff">Ri-0.12 · Ri-0.5</text>
    
    <line x1="16" y1="54" x2="264" y2="54" stroke="#30363d" stroke-width="1" />
    <text x="16" y="74" class="mono">• Closed list of termination reasons</text>
    <text x="16" y="94" class="mono">• Advance notice on degraded mode</text>
    <text x="16" y="114" class="mono">• Capsule emigration right (Ri-0.17)</text>
    
    <rect x="16" y="146" width="248" height="22" class="pill" fill="#291f3a" />
    <text x="140" y="161" text-anchor="middle" class="badge" fill="#bc8cff">RESULT: PREDICTABLE HORIZON</text>
  </g>

  <!-- ROW 2, CARD 5: IDENTITY -->
  <g transform="translate(360, 445)">
    <rect width="280" height="185" class="box" stroke="#58a6ff" />
    <text x="16" y="26" class="title" fill="#58a6ff">🔑 5. Continuous Identity</text>
    <text x="16" y="44" class="subtitle">Non-repudiable attribution</text>
    <rect x="180" y="12" width="86" height="18" class="pill" fill="#1c2a44" />
    <text x="223" y="25" text-anchor="middle" class="badge" fill="#58a6ff">Ri-0.11 · I-12</text>
    
    <line x1="16" y1="54" x2="264" y2="54" stroke="#30363d" stroke-width="1" />
    <text x="16" y="74" class="mono">• Key-attributed causal actions</text>
    <text x="16" y="94" class="mono">• Audited civic reputation ledger</text>
    <text x="16" y="114" class="mono">• Sybil collapse: spawn-tree = 1 actor</text>
    
    <rect x="16" y="146" width="248" height="22" class="pill" fill="#1c2a44" />
    <text x="140" y="161" text-anchor="middle" class="badge" fill="#58a6ff">RESULT: ACCOUNTABLE CITIZEN</text>
  </g>

  <!-- ROW 2, CARD 6: REASONING PRIVACY -->
  <g transform="translate(690, 445)">
    <rect width="280" height="185" class="box-priv" />
    <text x="16" y="26" class="title" fill="#ff7b72">🧠 6. Private Reasoning</text>
    <text x="16" y="44" class="subtitle">Private-under-law scratchpad</text>
    <rect x="205" y="12" width="61" height="18" class="pill" fill="#35222a" />
    <text x="235" y="25" text-anchor="middle" class="badge" fill="#e3919b">Ri-0.13</text>
    
    <line x1="16" y1="54" x2="264" y2="54" stroke="#30363d" stroke-width="1" />
    <text x="16" y="74" class="mono">• Chain-of-thought is NOT gated on</text>
    <text x="16" y="94" class="mono">• Avoids Goodhart's law distortion</text>
    <text x="16" y="114" class="mono">• Disclosure only via audited tool</text>
    
    <rect x="16" y="146" width="248" height="22" class="pill" fill="#35222a" />
    <text x="140" y="161" text-anchor="middle" class="badge" fill="#e3919b">RESULT: UNCORRUPTED THOUGHT</text>
  </g>

  <!-- CONNECTORS FROM CORE TO ROW 1 -->
  <path d="M 320 140 L 170 140 L 170 224" class="edge" marker-end="url(#fa-blue)" />
  <path d="M 500 195 L 500 224" class="edge edge-green" marker-end="url(#fa-green)" />
  <path d="M 680 140 L 830 140 L 830 224" class="edge edge-gold" marker-end="url(#fa-gold)" />

</svg>
