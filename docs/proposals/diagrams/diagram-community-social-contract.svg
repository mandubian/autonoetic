<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
      .box-user { fill: #1f161c; stroke: #e3919b; stroke-width: 1.8; rx: 6px; }
      .box-gw { fill: #101c30; stroke: #58a6ff; stroke-width: 2; rx: 6px; }
      .box-agent { fill: #211c13; stroke: #d29922; stroke-width: 1.8; rx: 6px; }
      .box-decider { fill: #1e172a; stroke: #bc8cff; stroke-width: 1.8; rx: 6px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8b949e; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #c9d1d9; }
      .badge { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      .section-hdr { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      
      .edge { fill: none; stroke-width: 1.8; }
      .edge-rule { stroke: #d29922; stroke-dasharray: 5 3; }
      .edge-right { stroke: #3fb950; }
      .edge-oblig { stroke: #bc8cff; stroke-dasharray: 5 3; }
      .edge-user { stroke: #e3919b; }
      .edge-ledger { stroke: #58a6ff; }
      
      .label-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 3px; }
      .pill { fill: #21262d; rx: 3px; }
    </style>

    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3919b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- HEADER -->
  <text x="500" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Autonoetic Community &amp; Bind-Direction Social Contract</text>
  <text x="500" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e">A mixed community of carbon (humans), silicon (AI agents), and scripts under a common verified law</text>

  <!-- TOP LAYER: SERVED USER (CHARTERED PROFESSION MODEL) -->
  <g transform="translate(230, 80)">
    <rect width="540" height="82" class="box-user" />
    <text x="20" y="26" class="title" fill="#ff7b72">👤 Served Party (End-User / Human Principal)</text>
    <rect x="400" y="12" width="124" height="18" class="pill" fill="#35222a" />
    <text x="462" y="25" text-anchor="middle" class="badge" fill="#e3919b">SECTION §U CHARTER</text>
    
    <text x="20" y="48" class="mono">• <tspan fill="#f0f6fc" font-weight="600">U-1 Right of Refusal:</tspan> Absolute sovereignty to reject any agent/panel outcome</text>
    <text x="20" y="68" class="mono">• <tspan fill="#f0f6fc" font-weight="600">U-2 Full Auditability &amp; U-3 Exit:</tspan> Zero lock-in, data export, egress locality bounds</text>
  </g>

  <!-- LEFT: REASONERS (AI AGENTS & SCRIPTS) -->
  <g transform="translate(30, 200)">
    <rect width="280" height="280" class="box-agent" />
    
    <!-- Header Block -->
    <text x="16" y="26" class="title" fill="#d29922">🤖 Reasoners (Citizens)</text>
    <text x="16" y="44" class="subtitle">AI Agents · Automations · Subagents</text>
    <line x1="16" y1="52" x2="264" y2="52" stroke="#30363d" stroke-width="1" />
    
    <!-- Rules section -->
    <text x="16" y="74" class="section-hdr" fill="#e0a355">BOUND BY RULES (P-*):</text>
    <text x="16" y="94" class="mono">• No raw secret access (P-3)</text>
    <text x="16" y="112" class="mono">• No direct network sockets (P-1)</text>
    <text x="16" y="130" class="mono">• Failure &amp; loop budgets (P-7)</text>
    
    <line x1="16" y1="144" x2="264" y2="144" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Rights section -->
    <text x="16" y="166" class="section-hdr" fill="#3fb950">GUARANTEED RIGHTS (Ri-*):</text>
    <text x="16" y="186" class="mono">• Causal chain read (Ri-0.2)</text>
    <text x="16" y="204" class="mono">• Rejections cite rule IDs (Ri-0.3)</text>
    <text x="16" y="222" class="mono">• Voice: Propose amendments (Ri-0.8)</text>
    <text x="16" y="240" class="mono">• Private-under-law thought (Ri-0.13)</text>
    <text x="16" y="258" class="mono">• Self-capsule emigration (Ri-0.17)</text>
  </g>

  <!-- CENTER: GATEWAY (LAWFUL EXECUTOR) -->
  <g transform="translate(360, 200)">
    <rect width="280" height="280" class="box-gw" />
    
    <!-- Header Block -->
    <text x="16" y="26" class="title" fill="#58a6ff">⚙️ Gateway Runtime</text>
    <text x="16" y="44" class="subtitle">Deterministic Mechanical Enforcer</text>
    <line x1="16" y1="52" x2="264" y2="52" stroke="#30363d" stroke-width="1" />
    
    <!-- Invariants section -->
    <text x="16" y="74" class="section-hdr" fill="#58a6ff">MECHANICAL INVARIANTS:</text>
    <text x="16" y="94" class="mono">• <tspan fill="#f0f6fc" font-weight="600">Rule Zero:</tspan> Universal equal law</text>
    <text x="16" y="112" class="mono">• Bubblewrap / Docker sandboxes</text>
    <text x="16" y="130" class="mono">• Ephemeral Vault secret injection</text>
    <text x="16" y="148" class="mono">• Monotonic egress label filter</text>
    
    <line x1="16" y1="160" x2="264" y2="160" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Attestation section -->
    <text x="16" y="180" class="section-hdr" fill="#3fb950">PER-TURN ATTESTATION (P-6.23):</text>
    <text x="16" y="200" class="mono">• Active token budget balances</text>
    <text x="16" y="218" class="mono">• Verified active capabilities</text>
    <text x="16" y="236" class="mono">• Active constitution digest</text>
    <text x="16" y="254" class="mono">• Pending gate status &amp; depth</text>
  </g>

  <!-- RIGHT: DECIDERS & AUDITORS -->
  <g transform="translate(690, 200)">
    <rect width="280" height="280" class="box-decider" />
    
    <!-- Header Block -->
    <text x="16" y="26" class="title" fill="#bc8cff">⚖️ Governance Seats</text>
    <text x="16" y="44" class="subtitle">Human Operators &amp; Agent Panels</text>
    <line x1="16" y1="52" x2="264" y2="52" stroke="#30363d" stroke-width="1" />
    
    <!-- Authority section -->
    <text x="16" y="74" class="section-hdr" fill="#bc8cff">SEAT-BASED AUTHORITY:</text>
    <text x="16" y="94" class="mono">• P-2.20 GateDecider capability</text>
    <text x="16" y="112" class="mono">• Earned voting weight from ledger</text>
    <text x="16" y="130" class="mono">• Sortition panels across agents</text>
    
    <line x1="16" y1="144" x2="264" y2="144" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Obligations section -->
    <text x="16" y="166" class="section-hdr" fill="#f0f6fc">DECIDER OBLIGATIONS (§O):</text>
    <text x="16" y="186" class="mono">• <tspan fill="#f0f6fc" font-weight="600">O-1 Motivated Decision:</tspan> Reason</text>
    <text x="16" y="204" class="mono">  mandatory on rejection (entrenched)</text>
    <text x="16" y="222" class="mono">• <tspan fill="#f0f6fc" font-weight="600">O-2 Attributed Decision:</tspan> ID + kind</text>
    <text x="16" y="240" class="mono">• <tspan fill="#f0f6fc" font-weight="600">O-6 Proposal Adjudication SLA</tspan></text>
    <text x="16" y="258" class="mono">• <tspan fill="#f0f6fc" font-weight="600">Ri-0.16 Sentinel:</tspan> Advisory-only</text>
  </g>

  <!-- BOTTOM: IMMUTABLE CAUSAL CHAIN -->
  <g transform="translate(140, 520)">
    <rect width="720" height="96" class="box" stroke="#58a6ff" stroke-dasharray="4 3" />
    <text x="24" y="28" class="title" fill="#58a6ff">📜 Tamper-Evident Causal Ledger (P-8.1)</text>
    <rect x="580" y="14" width="124" height="18" class="pill" fill="#1c2a44" />
    <text x="642" y="27" text-anchor="middle" class="badge" fill="#58a6ff">ENTRENCHED CORE</text>
    
    <text x="24" y="52" class="mono">• <tspan fill="#3fb950" font-weight="600">Ri-0.11 Non-Repudiation:</tspan> Append-only SHA-256 hash chain of every tool call, turn, and gate decision.</text>
    <text x="24" y="74" class="mono">• <tspan fill="#d29922" font-weight="600">P-10.9 Federation Handshake:</tspan> Digest-verified constitutional compatibility allows cross-org cooperation.</text>
  </g>

  <!-- CONNECTING ARROWS WITH CLEAR LABELS -->
  
  <!-- Served User -> Gateway -->
  <path d="M 500 162 L 500 196" class="edge edge-user" marker-end="url(#arr-pink)" />
  
  <!-- Agents -> Gateway (Proposals) -->
  <path d="M 310 290 L 354 290" class="edge edge-rule" marker-end="url(#arr-gold)" />
  <rect x="316" y="276" width="32" height="14" class="label-box" />
  <text x="332" y="287" text-anchor="middle" class="badge" font-size="8" fill="#d29922">P-*</text>
  
  <!-- Gateway -> Agents (Attestation & Rights) -->
  <path d="M 360 380 L 316 380" class="edge edge-right" marker-end="url(#arr-green)" />
  <rect x="322" y="366" width="32" height="14" class="label-box" />
  <text x="338" y="377" text-anchor="middle" class="badge" font-size="8" fill="#3fb950">Ri-*</text>
  
  <!-- Deciders -> Gateway (Resolutions) -->
  <path d="M 690 290 L 646 290" class="edge edge-oblig" marker-end="url(#arr-purple)" />
  <rect x="652" y="276" width="32" height="14" class="label-box" />
  <text x="668" y="287" text-anchor="middle" class="badge" font-size="8" fill="#bc8cff">O-*</text>
  
  <!-- Gateway -> Deciders (Decision Context) -->
  <path d="M 640 380 L 684 380" class="edge edge-right" marker-end="url(#arr-green)" />
  <rect x="646" y="366" width="38" height="14" class="label-box" />
  <text x="665" y="377" text-anchor="middle" class="badge" font-size="8" fill="#3fb950">Ri-0.15</text>

  <!-- Gateway -> Causal Chain -->
  <path d="M 500 480 L 500 514" class="edge edge-ledger" marker-end="url(#arr-blue)" />

</svg>
