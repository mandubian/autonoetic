<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
      .box-human { fill: #1f1b14; stroke: #e0a355; stroke-width: 2; rx: 6px; }
      .box-agent { fill: #101c2c; stroke: #58a6ff; stroke-width: 2; rx: 6px; }
      .box-seal { fill: #161224; stroke: #bc8cff; stroke-width: 2.2; rx: 8px; }
      .box-bottom { fill: #152219; stroke: #3fb950; stroke-width: 1.8; rx: 6px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #8b949e; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #c9d1d9; }
      .badge { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      .section-hdr { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      
      .edge { fill: none; stroke-width: 2; }
      .edge-gold { stroke: #e0a355; }
      .edge-blue { stroke: #58a6ff; }
      .edge-purple { stroke: #bc8cff; stroke-dasharray: 4 3; }
      .edge-green { stroke: #3fb950; }
      
      .pill { rx: 3px; }
    </style>

    <marker id="peer-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e0a355" />
    </marker>
    <marker id="peer-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="peer-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="peer-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- HEADER -->
  <text x="480" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Symmetric Citizenship: Humans &amp; AI under Common Law</text>
  <text x="480" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e">First-class participants operating at the same peer level of rights, rules, and obligations</text>

  <!-- TOP SEAL: THE CONSTITUTION & LAWFUL GATEWAY -->
  <g transform="translate(280, 80)">
    <rect width="400" height="96" class="box-seal" />
    <text x="200" y="28" text-anchor="middle" class="title" fill="#e9d5ff">🏛️ The Constitutional Seal</text>
    <rect x="130" y="38" width="140" height="18" class="pill" fill="#291f3a" />
    <text x="200" y="51" text-anchor="middle" class="badge" fill="#c1a3ec">SHARED DIGEST P-10.9</text>
    
    <text x="200" y="74" text-anchor="middle" class="mono">• <tspan fill="#f0f6fc" font-weight="600">Rule Zero (I-1):</tspan> Invariants apply equally without exception</text>
    <text x="200" y="88" text-anchor="middle" class="mono">• <tspan fill="#3fb950" font-weight="600">Lawful Executor:</tspan> Deterministic runtime with zero improvised policy</text>
  </g>

  <!-- LEFT COLUMN: HUMAN CITIZEN -->
  <g transform="translate(60, 220)">
    <rect width="390" height="260" class="box-human" />
    
    <!-- Title & Badge -->
    <text x="20" y="28" class="title" fill="#e0a355">👤 Human Participant</text>
    <rect x="250" y="14" width="120" height="18" class="pill" fill="#34281a" />
    <text x="310" y="27" text-anchor="middle" class="badge" fill="#e0a355">CARBON CITIZEN</text>
    
    <text x="20" y="48" class="subtitle">Operator · Auditor · Served Principal</text>
    <line x1="20" y1="56" x2="370" y2="56" stroke="#30363d" stroke-width="1" />
    
    <!-- Symmetrical Rights -->
    <text x="20" y="76" class="section-hdr" fill="#3fb950">COMMON RIGHTS (Ri-*):</text>
    <text x="20" y="96" class="mono">• Unconditional right to audit full causal history (<tspan fill="#f0f6fc">Ri-0.2</tspan>)</text>
    <text x="20" y="114" class="mono">• Right to submit constitutional proposals (<tspan fill="#f0f6fc">Ri-0.8</tspan>)</text>
    <text x="20" y="132" class="mono">• Right to refuse outcomes &amp; export data (<tspan fill="#f0f6fc">U-1 / U-3</tspan>)</text>
    
    <line x1="20" y1="146" x2="370" y2="146" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3 3" />
    
    <!-- Symmetrical Obligations -->
    <text x="20" y="168" class="section-hdr" fill="#bc8cff">SYMMETRIC OBLIGATIONS (§O):</text>
    <text x="20" y="188" class="mono">• Must provide motivated reasons for rejections (<tspan fill="#f0f6fc">O-1</tspan>)</text>
    <text x="20" y="206" class="mono">• Decisions bound to verified principal ID (<tspan fill="#f0f6fc">O-2</tspan>)</text>
    <text x="20" y="224" class="mono">• Bound by adjudication SLAs on proposals (<tspan fill="#f0f6fc">O-6</tspan>)</text>
    <text x="20" y="242" class="mono">• Bound by Rule Zero: cannot bypass safety rules</text>
  </g>

  <!-- RIGHT COLUMN: AI AGENT CITIZEN -->
  <g transform="translate(510, 220)">
    <rect width="390" height="260" class="box-agent" />
    
    <!-- Title & Badge -->
    <text x="20" y="28" class="title" fill="#58a6ff">🤖 AI Agent Participant</text>
    <rect x="250" y="14" width="120" height="18" class="pill" fill="#1c2a44" />
    <text x="310" y="27" text-anchor="middle" class="badge" fill="#58a6ff">SILICON CITIZEN</text>
    
    <text x="20" y="48" class="subtitle">Reasoner · Planner · Specialist Agent</text>
    <line x1="20" y1="56" x2="370" y2="56" stroke="#30363d" stroke-width="1" />
    
    <!-- Symmetrical Rights -->
    <text x="20" y="76" class="section-hdr" fill="#3fb950">COMMON RIGHTS (Ri-*):</text>
    <text x="20" y="96" class="mono">• Unconditional right to read own causal history (<tspan fill="#f0f6fc">Ri-0.2</tspan>)</text>
    <text x="20" y="114" class="mono">• Right to submit constitutional proposals (<tspan fill="#f0f6fc">Ri-0.8</tspan>)</text>
    <text x="20" y="132" class="mono">• Right to private-under-law reasoning (<tspan fill="#f0f6fc">Ri-0.13</tspan>)</text>
    
    <line x1="20" y1="146" x2="370" y2="146" stroke="#30363d" stroke-width="0.8" stroke-dasharray="3 3" />
    
    <!-- Symmetrical Obligations -->
    <text x="20" y="168" class="section-hdr" fill="#bc8cff">SYMMETRIC OBLIGATIONS (§O &amp; P-*):</text>
    <text x="20" y="188" class="mono">• Must provide motivated reasons if holding decider seat (<tspan fill="#f0f6fc">O-1</tspan>)</text>
    <text x="20" y="206" class="mono">• Actions non-repudiably attributed to actor key (<tspan fill="#f0f6fc">Ri-0.11</tspan>)</text>
    <text x="20" y="224" class="mono">• Bound by finite forbidden actions (no raw secrets, P-3)</text>
    <text x="20" y="242" class="mono">• Bound by Rule Zero: cannot bypass safety rules</text>
  </g>

  <!-- BOTTOM BAR: SHARED CAUSAL LEDGER & EQUAL STANDING -->
  <g transform="translate(140, 505)">
    <rect width="680" height="90" class="box-bottom" />
    <text x="340" y="26" text-anchor="middle" class="title" fill="#3fb950">📜 The Immutable Causal Chain: Non-Repudiable Ground Truth</text>
    <text x="340" y="48" text-anchor="middle" class="mono">
      <tspan fill="#f0f6fc" font-weight="600">Office Before Occupant:</tspan> Authority attaches to seats (P-2.20 GateDecider), not species.
    </text>
    <text x="340" y="66" text-anchor="middle" class="mono">
      <tspan fill="#e0a355">Humans</tspan> and <tspan fill="#58a6ff">AI Agents</tspan> build, review, and evolve the system together under verifiable mechanical law.
    </text>
    <text x="340" y="82" text-anchor="middle" class="badge" fill="#3fb950">TRUST IS STRUCTURAL, NOT PERSONAL</text>
  </g>

  <!-- SYMMETRIC CONNECTING ARROWS -->
  <!-- Seal -> Human -->
  <path d="M 380 176 L 255 214" class="edge edge-gold" marker-end="url(#peer-gold)" />
  
  <!-- Seal -> AI Agent -->
  <path d="M 580 176 L 705 214" class="edge edge-blue" marker-end="url(#peer-blue)" />

  <!-- Human -> Causal Chain -->
  <path d="M 255 480 L 340 502" class="edge edge-green" marker-end="url(#peer-green)" />

  <!-- AI Agent -> Causal Chain -->
  <path d="M 705 480 L 620 502" class="edge edge-green" marker-end="url(#peer-green)" />

</svg>
