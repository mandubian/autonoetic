version: 1
default_tier: specialized
rules:
  # Core tier: universally available tools.
  - prefix: content_
    tier: core
  # Reading the constitution is a right (Ri-0.10).
  - prefix: constitution_
    tier: core
  - prefix: knowledge_store
    tier: core
  - prefix: knowledge_recall
    tier: core
  - prefix: knowledge_search
    tier: core
  - prefix: artifact_
    tier: core
  # One front door for any artifact/content handle (#312).
  - prefix: resolve
    tier: core
  - prefix: sandbox_exec
    tier: core
  - prefix: sentinel_
    tier: core
  # Self-knowledge is a right-surfacing tool (like constitution_read) — keep it
  # Core so child sessions and budget-pressured turns still see it (#315).
  - prefix: self_describe
    tier: core
  # On-demand tool discovery — always available so agents can expand their
  # tool surface without waiting for escalation.
  - prefix: tool_discover
    tier: core

  # Workflow tier: orchestration and approval flow.
  - prefix: agent_spawn
    tier: workflow
  - prefix: agent_list
    tier: workflow
  - prefix: agent_discover
    tier: workflow
  - prefix: approval_
    tier: workflow
  - prefix: workflow_
    tier: workflow
  - prefix: eval_
    tier: workflow
  - prefix: user_
    tier: workflow
  - prefix: digest_
    tier: workflow
  - prefix: agent_inspect
    tier: workflow
  # Federation promotion gate — planner orchestration after jury roles complete.
  - prefix: federation.
    tier: workflow
  # Read-only promotion status for planners collecting federation verdicts.
  # Must precede the promotion_ specialized rule (promotion_record stays gated).
  - prefix: promotion_query
    tier: workflow
  # Credential onboarding is planner-first orchestration (vault-side, not web I/O).
  - prefix: credential_
    tier: workflow
  # Normalize third-party API docs into credential_setup-compatible skills.
  - prefix: skill_normalize
    tier: workflow
  # Cron scheduling for durable agents the planner installs.
  - prefix: scheduler_
  - prefix: planframe_
    tier: workflow

  # Specialized tier: expensive or role-specific operations.
  - prefix: web_
    tier: specialized
  - prefix: execution_
    tier: specialized
  - prefix: promotion_
    tier: specialized
  - prefix: agent_revision_
    tier: specialized
  - prefix: admin_proposal_
    tier: specialized
