version: 1
default_tier: specialized
rules:
  # Core tier: universally available tools.
  - prefix: content_
    tier: core
  # Reading the constitution is a right (Ri-0.10).
  - prefix: constitution_
    tier: core
  - prefix: knowledge_store
    tier: core
  - prefix: knowledge_recall
    tier: core
  - prefix: knowledge_search
    tier: core
  - prefix: artifact_
    tier: core
  # One front door for any artifact/content handle (#312).
  - prefix: resolve
    tier: core
  - prefix: sandbox_exec
    tier: core
  - prefix: sentinel_
    tier: core
  # Self-knowledge is a right-surfacing tool (like constitution_read) — keep it
  # Core so child sessions and budget-pressured turns still see it (#315).
  - prefix: self_describe
    tier: core
  # Reporting is capability-free like self_describe (future Ri-0.18) — the
  # least-privileged witness must still be able to report anomalies.
  - prefix: anomaly_flag
    tier: core
  # Native adjudication by an institutional office (Part F follow-up, #774).
  # Capability-gated (AnomalyAdjudicate) — tier is civic infrastructure; the
  # capability grant is the real boundary. Only the ombudsman office sees it.
  - prefix: anomaly_adjudicate
    tier: core
  # On-demand tool discovery — always available so agents can expand their
  # tool surface without waiting for escalation.
  - prefix: tool_discover
    tier: core
  # Platform documentation — every agent can learn about the system it runs on.
  - prefix: wiki_
    tier: core

  # Workflow tier: orchestration and approval flow.
  - prefix: agent_spawn
    tier: workflow
  - prefix: agent_list
    tier: workflow
  - prefix: agent_discover
    tier: workflow
  # Peer messaging is orchestration, not an expensive side effect. Without this
  # rule it fell to `default_tier: specialized`, which made it invisible to
  # every child session and to un-escalated root sessions — including the very
  # agents that declare the AgentMessage capability. The child filter already
  # grants Workflow when AgentMessage is declared
  # (`child_tool_tier_filter_for_manifest`), so Workflow is the tier that
  # matches the existing intent.
  - prefix: agent_message
    tier: workflow
  - prefix: approval_
    tier: workflow
  - prefix: workflow_
    tier: workflow
  - prefix: eval_
    tier: workflow
  - prefix: user_
    tier: workflow
  - prefix: digest_
    tier: workflow
  - prefix: agent_inspect
    tier: workflow
  # Federation promotion gate — planner orchestration after jury roles complete.
  - prefix: federation_
    tier: workflow
  # Read-only promotion status for planners collecting federation verdicts.
  # Must precede the promotion_ specialized rule (promotion_record stays gated).
  - prefix: promotion_query
    tier: workflow
  # Credential onboarding is planner-first orchestration (vault-side, not web I/O).
  - prefix: credential_
    tier: workflow
  # Normalize third-party API docs into credential_setup-compatible skills.
  - prefix: skill_normalize
    tier: workflow
  # Cron scheduling for durable agents the planner installs.
  - prefix: scheduler_
    tier: workflow
  - prefix: planframe_
    tier: workflow
  - prefix: workbench_
    tier: workflow
  - prefix: artifact_project
    tier: workflow
  - prefix: validation_
    tier: workflow

  # Specialized tier: expensive or role-specific operations.
  - prefix: web_
    tier: specialized
  - prefix: execution_
    tier: specialized
  - prefix: promotion_
    tier: specialized
  - prefix: agent_revision_
    tier: specialized
  - prefix: admin_proposal_
    tier: specialized
