# Autonoetic Gateway Configuration
# See docs/ARCHITECTURE.md and docs/AGENTS.md for full documentation
# Full reference: docs/config-reference.md

# agents_dir is set to absolute path based on config location
port: 4000
ofp_port: 4200
tls: false
max_concurrent_spawns: 8
max_pending_spawns_per_agent: 4
# System-wide ceiling for spawn-chain depth (R+3). Default: 8.
# Per-agent AgentSpawn.max_spawn_depth may be tighter; the lower bound wins.
# max_spawn_depth: 8

# ── Node Identity ─────────────────────────────────────────────────────
# Identity for OFP federation and causal chain authorship.
# Overridable by AUTONOETIC_NODE_ID and AUTONOETIC_NODE_NAME env vars.
node_id: "gateway"
node_name: "gateway"
# NOTE: AUTONOETIC_SHARED_SECRET must be set as an env var (not in config).

# ── Constitution ──────────────────────────────────────────────────────
# Active constitution artifacts enforced by this gateway instance.
# The active version is centralized in code as `ACTIVE_CONSTITUTION_VERSION`
# (autonoetic-types/src/config.rs); `source_path`/`lock_path` are intentionally
# omitted here so a version bump needs no template edit — they default to the
# active version. Override only to pin a different version, e.g.:
#   source_path: "docs/constitution/versions/<VERSION>/constitution.md"
#   lock_path:   "docs/constitution/versions/<VERSION>/gateway-constitution.lock.json"
# Gateway startup and `agent bootstrap` also materialize a local snapshot under
#   <agents_dir>/.gateway/constitution/
# which you can point at for fully runtime-local enforcement:
# constitution:
#   source_path: ".gateway/constitution/versions/<VERSION>/constitution.md"
#   lock_path:   ".gateway/constitution/versions/<VERSION>/gateway-constitution.lock.json"
#   require_signature: true
#   trusted_signers:
#     autonoetic:constitution:v1: "lNxT1b/jWa6LqM2Thd7rW1IppvlH3rlEnAOPV81Igzk="
constitution:
  require_signature: true
  trusted_signers:
    autonoetic:constitution:v1: "lNxT1b/jWa6LqM2Thd7rW1IppvlH3rlEnAOPV81Igzk="

# ── Sandbox ───────────────────────────────────────────────────────────
# Bubblewrap isolation overrides.
# Overridable by AUTONOETIC_BWRAP_SHARE_NET and AUTONOETIC_BWRAP_DEV_MODE env vars.
sandbox:
  share_net: false
  dev_mode: legacy   # legacy | minimal | host-bind

# ── Background Scheduler ──────────────────────────────────────────────
background_scheduler_enabled: true
background_tick_secs: 5
background_min_interval_secs: 60
max_background_due_per_tick: 32

# ── Scheduled Jobs (Cron) ─────────────────────────────────────────────
# scheduled_jobs:
#   min_interval_secs: 1        # Minimum interval between job triggers (seconds)
#   max_per_root: 50            # Max scheduled jobs per root session
#   max_due_per_tick: 16        # Max due jobs processed per scheduler tick
#
# Guardrail: sub-10s schedules are allowed only for script-mode target agents.
# For tight schedules (<5s), reduce background_tick_secs to 1 for better precision.

# ── Fast Scheduler Sidecar ────────────────────────────────────────────
# Parallel low-latency loop for interval-style jobs (every N seconds).
# Disabled by default. DB claim-and-advance remains the source of truth
# so the canonical scheduler and the fast sidecar cannot double-dispatch.
# Only interval-mode schedules are eligible; cron-style schedules stay
# on the canonical loop. Sub-10s intervals still require script-mode
# targets (defense-in-depth re-check at dispatch).
# fast_scheduler:
#   enabled: false
#   tick_millis: 200          # How often the fast loop wakes up (ms)
#   max_due_per_tick: 64      # Bounded work per tick

# ── Promotion Safety Governor ────────────────────────────────────────
# Three soft gates enforced at agent.revision.promote time:
#   velocity:        max promotions per alias in a sliding window
#   flapping:        reject if the candidate revision was promoted recently
#   eval-regression: halt if finding counts are strictly increasing over
#                    consecutive recent promotions
# All three are bypassable via force=true + force_reason (operator override).
# Disabled by default.
# promotion_governor:
#   enabled: false
#   velocity_window_hours: 24       # Sliding window for velocity check
#   max_promotions_per_window: 3    # Max promotes per alias in that window
#   flapping_lookback: 4            # How many recent promotions to scan
#   eval_regression_streak: 3       # Adjacent increases needed to halt
#   eval_regression_lookback: 6     # How many recent promotions to scan
#   max_promotion_attempts_per_revision: 3  # Rejected attempts per digest before operator ack

# ── Response Validation & Repair ──────────────────────────────────────
# When enabled, the gateway validates agent outputs against declared constraints.
# repair_enabled allows auto-repair only for agents that explicitly opt in
# via io.output_policy.repair.auto.
response_validation:
  enabled: true
  repair_enabled: true
  max_repair_attempts_ceiling: 2

# ── Validation Waivers ────────────────────────────────────────────────
# Optional operator workflow to skip advisory artifact validations
# (unit tests, style review, etc.) with recorded audit provenance.
# Disabled by default. When enabled, `/waive` is available in the Chat TUI
# and the picklist can be auto-proposed after `workbench reconcile`.
validation_waivers:
  enabled: false
  auto_propose_after_reconcile: false

# ── Approval Timeout ──────────────────────────────────────────────────
# Max seconds a task can stay in AwaitingApproval before auto-fail. 0 = no timeout.
approval_timeout_secs: 3600
# Maximum concurrent pending approvals per root session (R+5). Default: 50.
# Excess requests are rejected immediately with approval_flood.
# max_pending_approvals_per_root: 50
# Maximum concurrent un-adjudicated anomaly flags (pending/under_review) per
# reporter agent — the Ri-0.18 spam triage bound (#770). Default: 50.
# Filings beyond the cap are rejected loudly with anomaly_flag_flood (never
# silently dropped); terminal adjudications free capacity.
# max_pending_anomaly_flags_per_reporter: 50
# Per-host probe budget (#853; extended to web tools in #857). Max "wasted"
# probes against one host per session before the (N+1)th is refused with
# host_budget_exhausted. Covers sandbox_exec, web_fetch, and web_call GET, all
# sharing one per-host budget. A probe is wasted when it fails, or succeeds
# returning content already seen from that host (the SPA/rate-limited retry
# loop the rotating-poll guard misses because each script/URL differs); a novel
# success resets the count. Scoped per exact session_id (a re-spawn gets a fresh
# budget). 0 disables. Default: 3.
# max_probes_per_host: 3
# Optional: heartbeat interval for Running workflow tasks (seconds).
# Keeps task updated_at fresh during long-running child execution/finalization.
# If omitted, derives from background_tick_secs (clamped 1..=5). Valid range: 1..=30.
# workflow_task_heartbeat_secs: 2
# Optional: max seconds a Running task without progress before the stuck-task
# sweeper resolves it. Tasks with a fresh claim heartbeat are never swept. When
# the child session has completion evidence (manifest, digest, checkpoint, or
# implicit artifact), the sweeper force-completes it as `Succeeded`. With no
# evidence, `stuck_task_no_evidence_action` controls the outcome: `fail`
# (default) resolves as `Failed` and emits a `task.stuck` anomaly event;
# `succeed` preserves legacy behavior. Default: 600. Set to 0 to disable.
# stuck_task_timeout_secs: 600
# stuck_task_no_evidence_action: fail
# Multiplier applied to approval dwell times (R++4). Default: 1.0. Set to 0 to disable (tests).
# approval_dwell_multiplier: 1.0

# ── Signal Delivery ────────────────────────────────────────────────────
# Timeout in seconds for signal delivery responses (approval resolution,
# workflow join notifications). The signal sender waits this long for the
# planner to finish processing the triggered event.ingest turn (LLM inference
# + tool calls). Default: 60.
# signal_delivery_timeout_secs: 60

# Default blocking timeout (seconds) for workflow.wait when the agent omits
# timeout_secs. The tool blocks until all watched task_ids reach terminal
# state or this deadline elapses. Set to 0 to restore legacy immediate-return.
# Default: 30.
# default_workflow_wait_secs: 30
# Server-side total wall-clock budget for a single workflow.wait call (#702).
# When a timeout_secs chunk elapses with tasks still running, the gateway
# re-issues the wait internally — WITHOUT a full LLM round — up to this total,
# returning as soon as all watched task_ids reach a terminal state. Eliminates
# the wasteful wait→timeout→LLM-round→wait churn. Callers may lower it per-call
# via max_wait_secs. Set equal to default_workflow_wait_secs (or 0) to disable
# auto-extension. Default: 300.
# workflow_wait_max_total_secs: 300

# ── Hooks ──────────────────────────────────────────────────────────────
# Reactive bindings from gateway events to actions.
# Available events: session.closed, session.suspended, approval.resolved,
#   approval.requested, workflow.join.satisfied, artifact.created,
#   agent.promoted, emergency_stop, policy.decision
# Available actions: publish_report, deliver_signal, agent.spawn, http.callback
#
# hooks:
#   - on: "session.closed"
#     action: "publish_report"
#     async: true
#
#   - on: "approval.resolved"
#     action: "deliver_signal"
#     async: true
#
#   - on: "workflow.join.satisfied"
#     action: "deliver_signal"
#     async: true
#
#   # Spawn an evaluator agent whenever an approval is resolved.
#   # message_template supports {{field}} substitution from the hook context:
#   #   approval.resolved: request_id, decision
#   #   session.closed:    close_reason, turn_count
#   #   workflow.join.satisfied: workflow_id, task_ids
#   #   policy.decision:   root_session_id, session_id, agent_id, event_id, rule_ids,
#   #                      primary_rule_id, decision, status, category, action, target,
#   #                      reason, turn_id, source, plus {{event}} -> policy.decision
#   # allowed_agents restricts which agent IDs the hook may spawn (ACL).
#   - on: "approval.resolved"
#     action: "agent.spawn"
#     async: true                 # must be true — synchronous spawn is not supported
#     params:
#       agent_id: "evaluator.default"
#       message_template: "Evaluate approval {{request_id}} (decision: {{decision}})"
#     allowed_agents:
#       - evaluator.default       # ACL: only this agent may be spawned by this hook
#
#   # Observer-only: after selected causal_events rows (denials/errors, or success with
#   # non-baseline rule ids). See docs/ARCHITECTURE.md § Constitutional observability.
#   - on: "policy.decision"
#     action: "agent.spawn"
#     async: true
#     params:
#       agent_id: "constitutional-observer.default"
#       message_template: |
#         {{event}} root={{root_session_id}} session={{session_id}} agent={{agent_id}}
#         status={{status}} decision={{decision}} rules={{rule_ids}} event_id={{event_id}}
#         category={{category}} action={{action}} target={{target}} reason={{reason}}
#     allowed_agents:
#       - constitutional-observer.default

# ── Chat TUI ──────────────────────────────────────────────────────────
# Inline approval from the chat interface (Ctrl+A). Default: true; set false to
# require resolving approvals only via `autonoetic gateway approvals` (separate pane / process).
chat:
  inline_approvals: true

# ── Operator Activity Feed ────────────────────────────────────────────
# Channel-neutral live session visibility (chat TUI, HTTP SSE, future bridges).
# rate_limit_per_min: max activity rows persisted per root session per rolling
# 60s window. On the cap, further rows are dropped and one `rate_limited`
# notice is emitted (suppression stays visible). 0 disables. Default: 120.
operator_activity:
  rate_limit_per_min: 120
  # retention_days: maximum age (days) of operator activity rows before pruning. Default: 90.
  retention_days: 90

# ── Session Room ──────────────────────────────────────────────────────
# Controls the canonical session timeline (altitude model, role floors).
# role_floors: map of session-role name to minimum altitude. Only raises
# events, never lowers. Unconfigured roles use hardcoded defaults.
# Valid altitudes: detail, normal, attention, error.
# Default role floors (shown commented): sentinel→attention, runtime→detail,
# all others→detail.
# NOTE: This config surface is parsed and validated. Runtime plumbing to
# apply it during altitude computation is in progress — until that lands,
# the hardcoded defaults are used.
# session_room:
#   role_floors:
#     sentinel: attention
#     runtime: detail
#     planner: detail
#     specialist: detail
#     operator: detail

# ── Decider Obligations (symmetric obligations, #359 §O) ──────────────
# When enabled, the gateway refuses a BLOCKING-tier gate decision with no
# motivation: a principal's rejection/abort, or approval of an elevated-authority
# (any level above operator — admin or agent:<id>) or external/irreversible
# action. Mirrors the agent's Ri-0.3 duty. The gateway checks only that a reason
# is present, never its quality. Default: enabled.
decider_obligations:
  enabled: true
  # SLA (secs) before an un-adjudicated constitutional proposal (O-6) or
  # anomaly flag (O-7) is flagged as an adjudication SLA breach. The item's
  # status is unchanged — the decision is still owed. 0 disables the check.
  # Default: 604800 (7 days).
  adjudication_sla_secs: 604800

# ── Amendment Invitations (citizenship RFC #771 D.2) ────────────────
# When a rule is denied to the same agent alias at least `threshold` times
# within `window_secs`, the gateway issues a durable invitation to draft an
# amendment (Ri-0.8). The gateway never judges the rule; it executes a
# pre-committed threshold. An invitation is not an amendment and carries no
# authority. Default: enabled, threshold 3, window 7 days.
amendment_invitations:
  enabled: true
  threshold: 3
  window_secs: 604800

# ── Civic Eval Binding (citizenship RFC #774 E.3 phase 2) ───────────
# Makes the advisory civic eval scores (always surfaced in the promotion
# response) BINDING for high-risk capability revisions: a revision whose
# latest completed civic-core-v1 run scores pass_ratio below min_pass_ratio
# is rejected at promotion time. Advisory stays the floor (RFC invariant 5):
# binding is opt-in and defaults OFF — flip only once the civic-core-v1
# suites prove stable on your instance. A missing run passes through (does
# not block); the gate only bites when a run exists and fails the threshold.
civic_eval_binding:
  enabled: false
  min_pass_ratio: 0.8

# ── Anomaly Adjudication (citizenship RFC #774 Part F follow-up) ────
# Native ombudsman adjudication. When an office holds the AnomalyAdjudicate
# capability it can move flags to 'under_review' or a terminal decision via
# the anomaly_adjudicate tool, instead of routing every recommendation
# through an admin proposal for the operator to enact via anomaly.resolve.
# The operator remains the sovereignty backstop: set require_terminal_cosign
# to true to defer terminal decisions (confirmed/dismissed/deferred) back to
# anomaly.resolve. Default: false (office is trusted to enact its analysis).
anomaly_adjudication:
  require_terminal_cosign: false

# ── Approval Levels ───────────────────────────────────────────────────
# Escalation: require higher authority for sensitive actions.
# Levels: operator (default) | admin | agent:<agent_id>
# approval_levels:
#   default: operator
#   action_overrides:
#     SandboxExec: admin          # sandbox execution requires admin approval
#   host_overrides:
#     "prod-*": admin             # any action targeting prod-* requires admin

# ── Schema Enforcement ────────────────────────────────────────────────
# Validates agent.spawn payloads against declared schemas.
# mode: disabled | deterministic
schema_enforcement:
  mode: deterministic
  audit: true

# ── Evidence Mode ─────────────────────────────────────────────────────
# How much tool/LLM execution data to save for debugging.
# full: all results (development) | errors: failures only (production) | off
evidence_mode: full

# ── Operational Flags ─────────────────────────────────────────────────
# Whether interaction.answer orchestrates workflow task / session resume. Default: true.
# interaction_answer_orchestration: true
# Allow sessions to start even when runtime.lock drift is detected. Default: false.
# allow_runtime_lock_drift: false
# Accept unsigned agent bundle revisions (dev only). Default: false.
# trust_unsigned_bundles: false

# ── Security Sentinel ────────────────────────────────────────────────
# System-tier read-only auditor over causal events, promotion history,
# approvals, layer mounts, and SKILL.md bodies. Produces append-only
# `SecurityFinding` records. See docs/security-sentinel.md.
#
# Defaults are operator-friendly; uncomment to override:
#
# sentinel:
#   # Master switch. When false, sweeps and the promotion gate are skipped.
#   enabled: true
#   # Cron for the full (non-incremental) dual sweep. Each check still
#   # applies scan_limit (default 10000) and per-check window_days
#   # (e.g. 30 days for capability-accretion); "full" means no since_rfc3339
#   # cutoff is applied, not that every historical row is examined. UTC.
#   full_sweep_schedule: "0 3 * * *"
#   # Cron for the rolling 25 h incremental dual sweep
#   # (sets since_rfc3339 = now-25h). UTC.
#   incremental_sweep_schedule: "0 */6 * * *"
#   # When true, agent_revision_promote runs an in-memory Phase-1 sentinel
#   # scan first, SCOPED TO THE AGENT BEING PROMOTED. Each Phase-1 check
#   # filters its query by agent_id so a critical finding for agent A does
#   # not block promotion of agent B (issue #155). Any critical finding for
#   # the scoped agent blocks promotion. Fail-closed on scan errors and timeout.
#   #
#   # IMPORTANT: the gate does NOT consult or persist to security_findings —
#   # it re-evaluates the live event corpus on every promotion attempt.
#   # Triaging existing rows in security_findings will NOT unblock the gate.
#   # To unblock: resolve the signal in the underlying data for this agent,
#   # wait for windowed checks to age past their cutoff, raise per-check
#   # thresholds, or disable this gate.
#   promotion_gate_enabled: true
#   # Max seconds the gate waits for the in-memory sweep before fail-closing.
#   promotion_gate_timeout_secs: 30
#   # Revision label embedded in findings produced by the live sentinel.
#   sentinel_revision_id: "sentinel.current"
#   # Revision label for the frozen-baseline pass of the dual sweep.
#   baseline_revision_id: "sentinel.baseline.frozen"

# ── Code Analysis ─────────────────────────────────────────────────────
# Capability and security analysis for tool execution and generated artifacts.
# capability_provider: pattern | python_ast | llm | composite | none
# security_provider: pattern | python_ast | llm | composite | none
code_analysis:
  capability_provider: pattern
  security_provider: pattern
  require_capabilities: true
  require_approval_for:
    - NetworkAccess
    - CodeExecution
    - ArtifactExecution

# ── Capability Delta Gate ──────────────────────────────────────────────
# Controls how capability broadening during revision promotion is gated.
# strict: any capability broadening requires explicit approval (default).
# evolving: broadening inside an existing wildcard envelope is auto-allowed.
# bootstrap: disable capability-delta gating (development only).
# capability_delta_gate_mode: strict

# Promotion-completeness cursors (see docs/design/promotion-completeness-invariant.md).
# Completeness (auditor/evaluator pass, distinct identities, reviewable artifact)
# is ALWAYS fail-closed; these only tune the relief valves.
#   require_operator_approval_for_new_agents (default true): first admission of a
#     capability-bearing NEW agent requires operator approval. false ⇒ a fully-
#     audited new agent may self-promote (autonomous self-evolution).
#   allow_zero_capability_direct_promote (default true): a zero-capability
#     ("inoffensive") revision may direct-promote. false ⇒ full review gate even
#     for zero-capability agents.
# require_operator_approval_for_new_agents: true
# allow_zero_capability_direct_promote: true
#
#   agent_install_smoke_test (deprecated #578): ignored — smoke tests are now
#     required unconditionally for capability-bearing agents. Retained for YAML
#     compatibility only.
# agent_install_smoke_test: ask

# ── Session Budget (optional per-session resource limits) ─────────────
# Uncomment to cap LLM rounds, tool calls, tokens, or wall-clock time.
# session_budget:
#   profile: dev
#   max_llm_rounds: 200
#   max_tool_invocations: 500
#   max_llm_tokens: 5000000
#   max_wall_clock_secs: 3600

# ── Root Session Tree Budget (R+4 / R-6.21) ───────────────────────────
# Aggregate limits across ALL sessions sharing the same root_session_id.
# Applies in addition to per-session limits; the tighter bound wins.
# root_session_budget:
#   max_llm_rounds: 500
#   max_tool_invocations: 2000
#   max_llm_tokens: 20000000
#   max_wall_clock_secs: 7200
#   max_session_price_usd: 5.0

# ── Retention ─────────────────────────────────────────────────────────
# Days to keep execution_traces and causal_events. 0 = forever.
retention:
  execution_traces_days: 30
  causal_events_days: 90

# ── Cognitive Capsules ────────────────────────────────────────────────
# Controls the agent-portability capsule export/import pipeline.
# See docs/cognitive-capsule.md.
# capsule:
#   default_mode: thin                    # thin | hermetic | replay | headless
#   auto_sign: true                       # sign exports with the gateway key
#   include_memory_by_default: false      # opt-in memory snapshot export
#   max_capsule_size_bytes: 2147483648    # 2 GiB safety cap on imports
#   trusted_signers:                      # signer_id -> base64 32-byte Ed25519 public key
#     # gateway:example-fingerprint: "AAAA...="

# ── Resource Reclamation ──────────────────────────────────────────────
# Idempotent garbage collection for content blobs, old revisions,
# expired memories, orphaned sessions, and stale scheduled jobs.
# Disabled by default; enable with caution.
#reclamation:
#  enabled: true
#  min_interval_secs: 86400              # daily at most
#  content_blob_max_age_days: 90
#  archived_revision_max_age_days: 180
#  orphaned_session_max_age_days: 30
#  stale_job_max_age_days: 60

# ── Post-Session Digest ───────────────────────────────────────────────
# Gateway-internal post-session LLM step (`autonoetic.digest`). Requires
# `auto_learning.enabled` — not invoked by other agent bundles directly.
# Uncomment to enable.
# digest_agent:
#   enabled: true
#   min_turns: 2
#   llm_preset: agentic

# ── Session Report ────────────────────────────────────────────────────
# Structured live views under `.gateway/sessions/<id>/`.
# `live_html_on_update: false` (default) writes HTML only on session close.
#session_report:
#  live_html_on_update: false

# ── Evidence mode ─────────────────────────────────────────────────────
# `full` (default) | `errors` | `off` — controls per-tool evidence files.
#evidence_mode: errors

# ── Max Session Turns ─────────────────────────────────────────────────
# Soft circuit breaker: max turns per session before a SessionContinue
# approval is raised. Each operator clearance grants one more window of this
# size. Per-agent SKILL metadata may lower it (never raise it).
max_session_turns: 25
#
# Absolute per-session turn ceiling that continuation approvals CANNOT lift.
# Crossing it terminates the session (MaxTurnsReached, a declared
# budget-exhaustion reason under Ri-0.12); only emergency-stop or operator
# revoke can intervene. This is the system ceiling for per-agent
# `max_session_turns_hard` overrides. When unset, defaults to
# 2 × max_session_turns (so 50 with the default above). Binds delegated
# (child) sessions exactly as it binds the root.
#max_session_turns_hard: 50

# ── Loop Guard ───────────────────────────────────────────────────────
# Per-session circuit breaker for stuck agents. Independent trip conditions:
#   max_loops_without_progress: consecutive LLM rounds without meaningful progress.
#     Progress = a successful tool call whose (tool_name, normalized_arguments)
#     fingerprint is new since the previous call (or repeats up to
#     max_consecutive_same_progress times, subject to per-tool progress budgets).
#     A successful tool call with the same fingerprint as the previous one does
#     NOT reset the counter — repetition is still divergence.
#   max_tool_failures: total failures for a single tool name (regardless of arguments/hosts)
#   max_consecutive_same_progress: after N identical tool+args calls, stop counting as progress
#   max_child_failures: total child-agent spawn failures before suspension
#   rotation_window_size / rotation_distinct_floor: rotating-polling detector
#     (issue #287). Trips when the last `rotation_window_size` successful tool
#     calls contain only `rotation_distinct_floor` or fewer distinct
#     (tool, args) fingerprints — catches agents cycling through a small set of
#     read-only tools (workflow.wait → workflow.state → content.read → ...) that
#     defeats `max_loops_without_progress` because each call has a fresh
#     fingerprint. Set `rotation_window_size: 0` to disable.
#   roster_repeat_floor: fast-path trip for idempotent read-only roster reads
#     (agent_list / agent_inspect / agent_discover). Trips after this many
#     consecutive identical calls — well before the rotation window fills —
#     because re-listing never returns new data. The corrective trip message
#     tells the agent to spawn directly with a free-text message or end the
#     turn. Set to 0 to disable the fast path.
#   child_failure_loop_penalty: loops added to the no-progress counter on each
#     child task failure (issue #704). A queued agent_spawn returns ok and
#     resets progress, but a child that later fails means that spawn made no
#     net progress — so each failure advances (does not reset) current_loops by
#     this amount. Combined with read-only tools no longer resetting progress
#     (#701), a spawn→probe→spawn death spiral reaches max_loops_without_progress
#     instead of never. Set to 0 to disable (legacy behavior).
#   recurring_error_window / recurring_error_distinct_tools: recurring-error
#     detector (issue #703). Each error tool-result is fingerprinted (volatile
#     ids/timestamps/numbers stripped) and tracked in a sliding window of the
#     last `recurring_error_window` errors. When the same fingerprint surfaces
#     from `recurring_error_distinct_tools` or more distinct tool names, the
#     guard trips — catching an agent rotating through different tools that all
#     hit one unrecoverable root cause (which per-tool budgets miss). Set the
#     window to 0 to disable.
#   max_irrecoverable_repeats: repeated-irrecoverable-rejection trip threshold
#     (issue #718). Permission / quota / sandbox-unavailable rejections are
#     excluded from max_tool_failures (retrying can't fix them), so the first
#     occurrences are free — the agent legitimately ends its turn to await an
#     operator. But re-issuing the SAME call for the SAME deterministic
#     rejection (e.g. agent_revision_promote against a standing
#     capability_delta_requires_approval) is a no-progress loop (P-7.7). When
#     the same (tool, normalized-error) rejection recurs this many times the
#     guard trips. Distinct rejections never accumulate together. Set to 0 to
#     disable.
#   max_spawn_identity_repeats: parent spawn-loop trip threshold (RFC #776
#     Part B.4). When a parent delegates to the same agent_id with the same
#     contract + input this many times, the guard trips with
#     `RepeatedSpawnIdentity`. The identity key is structural (agent_id +
#     expected_outputs hash + input digest) — start strict; the trip surfaces
#     the attempt history to an operator/escalation gate. Catches the
#     "declare success, produced nothing → respawn the same child" loop
#     that the B.1 output-contract check converts from silent failure to a
#     typed `output_contract_unmet` failure. Set to 0 to disable.
#loop_guard:
#  max_loops_without_progress: 10
#  max_tool_failures: 8
#  max_consecutive_same_progress: 1
#  max_child_failures: 5
#  rotation_window_size: 16
#  rotation_distinct_floor: 6
#  roster_repeat_floor: 3
#  child_failure_loop_penalty: 2
#  recurring_error_window: 10
#  recurring_error_distinct_tools: 3
#  max_irrecoverable_repeats: 3
#  max_spawn_identity_repeats: 3

# ── Prompt Budget (Safe Defaults) ──────────────────────────────────────
# Transparency and enforcement for context window usage.
# Uncomment to customize.
prompt_budget:
  system_prompt_max_tokens: 0
  tool_definitions_max_tokens: 0
  warn_at_pct: 75.0
  margin_tokens: 4096
  # DEPRECATED (no-op). Tool schemas are never compressed; stripping them to
  # {"type": "object"} corrupted tool-calling on turn 1+. Tool tokens are now
  # saved losslessly via provider tool-array caching (prompt_cache_enabled).
  compress_tool_schemas_after_turn_0: false
  # Maximum number of tool definitions sent per turn (0 = unlimited).
  # Excess tools are dropped from lowest tier first (Specialized → Workflow → Core).
  max_tool_definitions: 40
  # Root sessions start with Core + Workflow tools only (~40 for planner.default).
  # After the first Specialized tool call, all tiers unlock (~10 more; total ~50).
  progressive_tool_disclosure: true
  # Soft token budget that triggers the context governor proactively, before
  # the hard context-window limit is reached. Useful for large context-window
  # models (e.g. 200K tokens) where waiting for the hard limit wastes tokens
  # on every round. Set to 30000-50000 for such models; leave unset to disable.
  # soft_budget_tokens: 40000
  # Strip reasoning_content / reasoning_details from assistant messages before
  # sending them to the LLM. The model does not need to re-read its own
  # chain-of-thought, and checkpoints/exports/timeline keep the full reasoning
  # for audit. Disabled by default because many thinking/reasoning models
  # (DeepSeek, OpenRouter reasoning models, etc.) require reasoning replay.
  # Enable only when you are sure your model does not need it.
  # strip_reasoning_from_request: false
  # Maximum characters to allow in a tool-result message content before it is
  # truncated for the LLM request. JSON results have their large string *values*
  # shortened in-place — structure + metadata (offset, next_offset, total_bytes,
  # error_type, etc.) survive so agents can paginate. Non-JSON results get a
  # head+tail ellipsis. The full result is always stored regardless.
  # Default is 4000. Set to 0 to disable truncation.
  # max_tool_result_chars: 4000
  # Collapse duplicate tool-result messages into a short marker
  # ("duplicate result — see above"). Re-reading artifacts or polling status
  # tools often produces identical output across turns; this saves tokens while
  # keeping the full results in storage. Enabled by default.
  # dedup_tool_results: true
  # Collapse *recurring errors* (issue #705). Unlike dedup_tool_results
  # (byte-identical, consecutive), this fingerprints the error text (volatile
  # ids/timestamps/numbers stripped) so the same root-cause failure surfacing
  # non-consecutively — the hallmark of an install/spawn death spiral — is
  # collapsed to a marker on all but its most recent occurrence. Full results
  # remain in storage. Enabled by default.
  # collapse_repeated_errors: true
  # Mark the stable leading portion of the system prompt (foundation doctrine +
  # SKILL instructions + guidance + output contract) as a provider prompt-cache
  # prefix. Cache-capable drivers attach cache_control:{type:ephemeral} there —
  # Anthropic (otherwise sends NO cache markers → caching was off) and OpenRouter
  # when routing Claude/Gemini. The volatile per-turn tail (state attestation,
  # degradation notice) sits after the breakpoint and is never cached. OpenAI and
  # llama.cpp reuse a stable prefix automatically. Enabled by default.
  # prompt_cache_enabled: true
  # Chars-per-token ratio used by the prompt-budget estimator. The default
  # (3.0) is conservative — it matches Qwen3 / Llama3 / GPT-4o on code/JSON
  # content, which is typically 2.2–3.5 chars/token. The previous default
  # of 4.0 systematically underestimated such prompts, letting the context
  # governor stay silent until the LLM call returned a 400. Set this if
  # your tokenizer behaves materially differently (e.g. quantized local
  # models with aggressive BPE splitting). Out-of-range values are clamped
  # to [0.5, 16.0]; non-finite values fall back to the default.
  # chars_per_token: 3.0
#
# ── Tool Tier Registry (Constitution 4.7) ──────────────────────────────
# Tier assignments are declarative in config/tools.yaml and loaded at gateway start.
# Override registry path with env var AUTONOETIC_TOOL_TIER_REGISTRY_PATH.
# Schema:
#   version: 1
#   default_tier: specialized
#   rules:
#     - prefix: content_
#       tier: core

# ── Cross-cutting Routing Concerns ────────────────────────────────────
# Agent overrides and approval gates. Model definitions live in llm_presets.
llm_routing:
  agent_overrides:
    planner.default:
      min_tier: standard                      # economy | standard | premium
  approval_gates:
    premium_model_first_use: false            # require approval before first premium model use
    budget_threshold_crossed: 0.75            # 0.0–1.0, require approval when budget exceeds this

# ── LLM Presets ───────────────────────────────────────────────────────
# Unified registry: fixed presets (concrete provider/model) and routing
# presets (dynamic selection from fixed presets at call time).
#
# tier: economy | standard | premium
# strategy: disabled | deterministic | classifier | hybrid
#
# For local OpenAI-compatible servers (LM Studio, Ollama, etc.), set base_url:
#
#   local:
#     provider: "lmstudio"
#     model: "unsloth/qwen3.5-35b-a3bi@q4_k_xl"
#     base_url: "http://192.168.1.20:1234/v1"
#     tier: economy
#
llm_presets:
  # ── Fixed presets: concrete model definitions ───────────────────────
  haiku:
    provider: "anthropic"
    model: "claude-haiku-3-20250307"
    tier: economy
    cost:
      input_per_million: 0.25
      output_per_million: 1.25

  sonnet:
    provider: "anthropic"
    model: "claude-sonnet-4-20250514"
    tier: standard
    cost:
      input_per_million: 3.0
      output_per_million: 15.0

  opus:
    provider: "anthropic"
    model: "claude-opus-4-20250514"
    tier: premium
    cost:
      input_per_million: 15.0
      output_per_million: 75.0
    # thinking:
    #   effort: high
    #   budget_tokens: 8192

  # ── Routing presets: select from fixed presets at call time ─────────
  smart:
    routing:
      strategy: hybrid
      models: [opus, sonnet, haiku]           # fixed preset names
      classifier_preset: haiku                # fixed preset for classification
      deterministic:
        max_tier: premium                     # economy | standard | premium
        budget_downgrade_threshold: 0.8       # 0.0–1.0
        enable_fallback_chain: true
      classifier:
        timeout_secs: 2
        skip_threshold: 0.95                  # 0.0–1.0
      hybrid:
        ambiguity_threshold: 0.5              # 0.0–1.0
    thinking:
      effort: medium

  budget:
    routing:
      strategy: deterministic
      models: [sonnet, haiku]
      deterministic:
        max_tier: standard                    # economy | standard | premium
        budget_downgrade_threshold: 0.6
        enable_fallback_chain: true

  # ── Legacy presets (backward compatible, no routing) ────────────────
  agentic:
    provider: "openrouter"
    model: "minimax/minimax-m2.7"
    temperature: 0.2
    thinking:
      effort: medium

  coding:
    provider: "openrouter"
    model: "minimax/minimax-m2.7"
    temperature: 0.1

  research:
    provider: "openrouter"
    model: "minimax/minimax-m2.7"
    temperature: 0.3

  fallback:
    provider: "openai"
    model: "gpt-4o"
    temperature: 0.2

  gemma4_31b:
    provider: "lmstudio"
    model: "gemma-4-31B-it-Q5_K_M"
    temperature: 1.0
    base_url: "http://192.168.1.20:8080/v1/chat/completions"
    thinking:
      effort: medium

  qwen36_35_a3b:
    provider: "lmstudio"
    model: "Qwen3.6-35B-A3B-GGUF"
    temperature: 1.0
    base_url: "http://192.168.1.20:8080/v1/chat/completions"
    thinking:
      effort: medium

  elephant:
    provider: "openrouter"
    model: "openrouter/elephant-alpha"
    temperature: 1.0


# Role → preset for agent init and agents without manifest llm_preset.
# In-repo bundles declare llm_preset directly; mapping is fallback + cross-cutting roles.
llm_preset_mapping:
  planner: smart
  planner.collaborative: smart
  coder: coding
  executor: coding
  researcher: research
  debugger: coding
  evaluator: coding
  architect: coding
  auditor: coding
  specialized_builder: agentic
  packager: agentic
  registration: agentic
  agent-factory: agentic
  discovery: research
  memory-curator: agentic
  evolution-steward: agentic
  evolution-orchestrator: agentic
  agent-adapter: agentic
  context_compression: haiku
  default: fallback

# ── Default Orchestrator ────────────────────────────────────────────
# The lead agent used for new sessions. Override to use the
# collaborative planner for PlanFrame-aware workflows.
# default_orchestrator: "planner.collaborative"

# ── Local / deployment-specific presets (optional) ─────────────────
# Point semantic presets at your hardware, e.g. replace coding/agentic provider/model
# with gemma4_31b, or map roles to gemma4_31b via llm_preset_mapping above.

# ── Context Compression (Safe Defaults) ──────────────────────────────
# Summarizes old conversation turns when approaching context limits.
# The hierarchical capsule strategy is the default LLM-tier reducer in
# the context governor pipeline.
context_compression:
  enabled: true
  llm_preset: haiku            # use a preset name, or set provider+model inline
  # provider: anthropic         # inline provider (when not using llm_preset)
  # model: claude-haiku-3-20250307  # inline model (when not using llm_preset)
  threshold_pct: 60.0
  recent_turns_to_keep: 3
  max_summary_tokens: 500
  min_turns_between_compression: 3
  # Capsule strategy settings
  max_capsule_decisions: 30   # decisions to retain before summarization
  max_completed_tasks: 10     # completed tasks to retain

# ── System Agents ─────────────────────────────────────────────────────
# Declared background agents that the gateway reconciles on startup.
# Each entry gets its cron job created automatically if missing.
# Control manually: autonoetic gateway system-agents list|bootstrap|run
#
# system_agents:
#   - agent_id: evolution-orchestrator.default
#     schedule: "0 */4 * * *"
#     message: "Run evolution analysis cycle"
#     enabled: true
#   - agent_id: ombudsman.default
#     schedule: "0 */2 * * *"
#     message: "Ombudsman sweep: review anomaly-flag queue"
#     enabled: true

# ── Protected Agents (issue #21) ───────────────────────────────────────
# Critical agents whose promotion requires eval-run evidence.
# A regressed agent-factory cannot silently replace itself without
# passing an independent eval suite first.
#
# protected_agents:
#   enabled: true
#   agents:
#     - agent-factory.default
#     - specialized_builder.default
#     - evolution-orchestrator.default

# ── Wiki Proposal Governance ─────────────────────────────────────────
# Quality heuristics are advisory (warn, don't block) — operator always has final say.
# Duplicate detection flags similar proposals for reviewer attention, doesn't auto-reject.
#
# wiki_proposal:
#   # Auto-expiry TTL for pending proposals (0 = disabled). Default: 7 days.
#   auto_expire_secs: 604800
#   # Advisory content quality checks.
#   quality_heuristics_enabled: true
#   min_content_length: 100
#   min_headings: 1
#   # Duplicate detection via Jaccard similarity over content tokens.
#   duplicate_detection_enabled: true
