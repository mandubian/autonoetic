# Autonoetic Gateway Configuration
# See docs/ARCHITECTURE.md and docs/AGENTS.md for full documentation
# Full reference: docs/config-reference.md

# agents_dir is set to absolute path based on config location
port: 4000
ofp_port: 4200
tls: false
max_concurrent_spawns: 8
max_pending_spawns_per_agent: 4
# System-wide ceiling for spawn-chain depth (R+3). Default: 8.
# Per-agent AgentSpawn.max_spawn_depth may be tighter; the lower bound wins.
# max_spawn_depth: 8

# ── Node Identity ─────────────────────────────────────────────────────
# Identity for OFP federation and causal chain authorship.
# Overridable by AUTONOETIC_NODE_ID and AUTONOETIC_NODE_NAME env vars.
node_id: "gateway"
node_name: "gateway"
# NOTE: AUTONOETIC_SHARED_SECRET must be set as an env var (not in config).

# ── Constitution ──────────────────────────────────────────────────────
# Active constitution artifacts enforced by this gateway instance.
# To switch constitutional release, point both paths to the same version dir.
# Gateway startup and `agent bootstrap` also materialize a local snapshot under:
#   <agents_dir>/.gateway/constitution/
# You can point source_path/lock_path there for fully runtime-local enforcement.
constitution:
  source_path: "docs/constitution/versions/2026.05.05/constitution.md"
  lock_path: "docs/constitution/versions/2026.05.05/gateway-constitution.lock.json"
  require_signature: true
  trusted_signers:
    autonoetic:constitution:v1: "lNxT1b/jWa6LqM2Thd7rW1IppvlH3rlEnAOPV81Igzk="
# constitution:
#   source_path: ".gateway/constitution/versions/2026.05.05/constitution.md"
#   lock_path: ".gateway/constitution/versions/2026.05.05/gateway-constitution.lock.json"
#   require_signature: true
#   trusted_signers:
#     autonoetic:constitution:v1: "lNxT1b/jWa6LqM2Thd7rW1IppvlH3rlEnAOPV81Igzk="

# ── Sandbox ───────────────────────────────────────────────────────────
# Bubblewrap isolation overrides.
# Overridable by AUTONOETIC_BWRAP_SHARE_NET and AUTONOETIC_BWRAP_DEV_MODE env vars.
sandbox:
  share_net: false
  dev_mode: legacy   # legacy | minimal | host-bind

# ── Background Scheduler ──────────────────────────────────────────────
background_scheduler_enabled: true
background_tick_secs: 5
background_min_interval_secs: 60
max_background_due_per_tick: 32

# ── Scheduled Jobs (Cron) ─────────────────────────────────────────────
# scheduled_jobs:
#   min_interval_secs: 1        # Minimum interval between job triggers (seconds)
#   max_per_root: 50            # Max scheduled jobs per root session
#   max_due_per_tick: 16        # Max due jobs processed per scheduler tick
#
# Guardrail: sub-10s schedules are allowed only for script-mode target agents.
# For tight schedules (<5s), reduce background_tick_secs to 1 for better precision.

# ── Response Validation & Repair ──────────────────────────────────────
# When enabled, the gateway validates agent outputs against declared constraints.
# repair_enabled allows auto-repair only for agents that explicitly opt in
# via io.output_policy.repair.auto.
response_validation:
  enabled: true
  repair_enabled: true
  max_repair_attempts_ceiling: 2

# ── Approval Timeout ──────────────────────────────────────────────────
# Max seconds a task can stay in AwaitingApproval before auto-fail. 0 = no timeout.
approval_timeout_secs: 600
# Maximum concurrent pending approvals per root session (R+5). Default: 50.
# Excess requests are rejected immediately with approval_flood.
# max_pending_approvals_per_root: 50
# Optional: heartbeat interval for Running workflow tasks (seconds).
# Keeps task updated_at fresh during long-running child execution/finalization.
# If omitted, derives from background_tick_secs (clamped 1..=5). Valid range: 1..=30.
# workflow_task_heartbeat_secs: 2

# ── Signal Delivery ────────────────────────────────────────────────────
# Timeout in seconds for signal delivery responses (approval resolution,
# workflow join notifications). The signal sender waits this long for the
# planner to finish processing the triggered event.ingest turn (LLM inference
# + tool calls). Default: 60.
# signal_delivery_timeout_secs: 60

# ── Hooks ──────────────────────────────────────────────────────────────
# Reactive bindings from gateway events to actions.
# Available events: session.closed, session.suspended, approval.resolved,
#   approval.requested, workflow.join.satisfied, artifact.created,
#   agent.promoted, emergency_stop, policy.decision
# Available actions: publish_report, deliver_signal, agent.spawn, http.callback
#
# hooks:
#   - on: "session.closed"
#     action: "publish_report"
#     async: true
#
#   - on: "approval.resolved"
#     action: "deliver_signal"
#     async: true
#
#   - on: "workflow.join.satisfied"
#     action: "deliver_signal"
#     async: true
#
#   # Spawn an evaluator agent whenever an approval is resolved.
#   # message_template supports {{field}} substitution from the hook context:
#   #   approval.resolved: request_id, decision
#   #   session.closed:    close_reason, turn_count
#   #   workflow.join.satisfied: workflow_id, task_ids
#   #   policy.decision:   root_session_id, session_id, agent_id, event_id, rule_ids,
#   #                      primary_rule_id, decision, status, category, action, target,
#   #                      reason, turn_id, source, plus {{event}} -> policy.decision
#   # allowed_agents restricts which agent IDs the hook may spawn (ACL).
#   - on: "approval.resolved"
#     action: "agent.spawn"
#     async: true                 # must be true — synchronous spawn is not supported
#     params:
#       agent_id: "evaluator.default"
#       message_template: "Evaluate approval {{request_id}} (decision: {{decision}})"
#     allowed_agents:
#       - evaluator.default       # ACL: only this agent may be spawned by this hook
#
#   # Observer-only: after selected causal_events rows (denials/errors, or success with
#   # non-baseline rule ids). See docs/ARCHITECTURE.md § Constitutional observability.
#   - on: "policy.decision"
#     action: "agent.spawn"
#     async: true
#     params:
#       agent_id: "constitutional-observer.default"
#       message_template: |
#         {{event}} root={{root_session_id}} session={{session_id}} agent={{agent_id}}
#         status={{status}} decision={{decision}} rules={{rule_ids}} event_id={{event_id}}
#         category={{category}} action={{action}} target={{target}} reason={{reason}}
#     allowed_agents:
#       - constitutional-observer.default

# ── Chat TUI ──────────────────────────────────────────────────────────
# Inline approval from the chat interface (Ctrl+A).
chat:
  inline_approvals: true   # Allow Ctrl+A to approve the latest pending approval

# ── Approval Levels ───────────────────────────────────────────────────
# Escalation: require higher authority for sensitive actions.
# Levels: operator (default) | admin | agent:<agent_id>
# approval_levels:
#   default: operator
#   action_overrides:
#     SandboxExec: admin          # sandbox execution requires admin approval
#   host_overrides:
#     "prod-*": admin             # any action targeting prod-* requires admin

# ── Schema Enforcement ────────────────────────────────────────────────
# Validates agent.spawn payloads against declared schemas.
# mode: disabled | deterministic
schema_enforcement:
  mode: deterministic
  audit: true

# ── Evidence Mode ─────────────────────────────────────────────────────
# How much tool/LLM execution data to save for debugging.
# full: all results (development) | errors: failures only (production) | off
evidence_mode: full

# ── Security Sentinel ────────────────────────────────────────────────
# System-tier read-only auditor over causal events, promotion history,
# approvals, layer mounts, and SKILL.md bodies. Produces append-only
# `SecurityFinding` records. See docs/security-sentinel.md.
#
# Defaults are operator-friendly; uncomment to override:
#
# sentinel:
#   # Master switch. When false, sweeps and the promotion gate are skipped.
#   enabled: true
#   # Cron for the full (non-incremental) dual sweep. Each check still
#   # applies scan_limit (default 10000) and per-check window_days
#   # (e.g. 30 days for capability-accretion); "full" means no since_rfc3339
#   # cutoff is applied, not that every historical row is examined. UTC.
#   full_sweep_schedule: "0 3 * * *"
#   # Cron for the rolling 25 h incremental dual sweep
#   # (sets since_rfc3339 = now-25h). UTC.
#   incremental_sweep_schedule: "0 */6 * * *"
#   # When true, agent_revision_promote runs an in-memory Phase-1 sentinel
#   # scan first, SCOPED TO THE AGENT BEING PROMOTED. Each Phase-1 check
#   # filters its query by agent_id so a critical finding for agent A does
#   # not block promotion of agent B (issue #155). Any critical finding for
#   # the scoped agent blocks promotion. Fail-closed on scan errors and timeout.
#   #
#   # IMPORTANT: the gate does NOT consult or persist to security_findings —
#   # it re-evaluates the live event corpus on every promotion attempt.
#   # Triaging existing rows in security_findings will NOT unblock the gate.
#   # To unblock: resolve the signal in the underlying data for this agent,
#   # wait for windowed checks to age past their cutoff, raise per-check
#   # thresholds, or disable this gate.
#   promotion_gate_enabled: true
#   # Max seconds the gate waits for the in-memory sweep before fail-closing.
#   promotion_gate_timeout_secs: 30
#   # Revision label embedded in findings produced by the live sentinel.
#   sentinel_revision_id: "sentinel.current"
#   # Revision label for the frozen-baseline pass of the dual sweep.
#   baseline_revision_id: "sentinel.baseline.frozen"

# ── Code Analysis ─────────────────────────────────────────────────────
# Capability and security analysis for tool execution and generated artifacts.
# capability_provider: pattern | python_ast | llm | composite | none
# security_provider: pattern | python_ast | llm | composite | none
code_analysis:
  capability_provider: pattern
  security_provider: pattern
  require_capabilities: true
  require_approval_for:
    - NetworkAccess
    - CodeExecution

# ── Session Budget (optional per-session resource limits) ─────────────
# Uncomment to cap LLM rounds, tool calls, tokens, or wall-clock time.
# session_budget:
#   profile: dev
#   max_llm_rounds: 200
#   max_tool_invocations: 500
#   max_llm_tokens: 5000000
#   max_wall_clock_secs: 3600

# ── Root Session Tree Budget (R+4 / R-6.21) ───────────────────────────
# Aggregate limits across ALL sessions sharing the same root_session_id.
# Applies in addition to per-session limits; the tighter bound wins.
# root_session_budget:
#   max_llm_rounds: 500
#   max_tool_invocations: 2000
#   max_llm_tokens: 20000000
#   max_wall_clock_secs: 7200
#   max_session_price_usd: 5.0

# ── Retention ─────────────────────────────────────────────────────────
# Days to keep execution_traces and causal_events. 0 = forever.
retention:
  execution_traces_days: 30
  causal_events_days: 90

# ── Post-Session Digest ───────────────────────────────────────────────
# LLM summarization + memory extraction after sessions complete.
# Uncomment to enable.
# digest_agent:
#   enabled: true
#   min_turns: 2
#   llm_preset: agentic

# ── Max Session Turns ─────────────────────────────────────────────────
# Circuit breaker: max turns per session before forced suspension.
max_session_turns: 12

# ── Loop Guard ───────────────────────────────────────────────────────
# Per-session circuit breaker for stuck agents. Two independent trip conditions:
#   max_loops_without_progress: consecutive LLM rounds without any ok:true tool result
#   max_tool_failures: total failures for a single tool name (regardless of arguments/hosts)
#   max_consecutive_same_progress: after N identical tool+args calls, stop counting as progress
#loop_guard:
#  max_loops_without_progress: 5
#  max_tool_failures: 5
#  max_consecutive_same_progress: 1

# ── Prompt Budget ─────────────────────────────────────────────────────
# Transparency and enforcement for context window usage.
# Uncomment to customize (defaults: warn_at 80%, 4096 margin tokens).
# prompt_budget:
#   system_prompt_max_tokens: 0
#   tool_definitions_max_tokens: 0
#   warn_at_pct: 80.0
#   margin_tokens: 4096
#   on_exceeded: warn           # warn | trim_history | demote_tools | fail
#   compress_tool_schemas_after_turn_0: false
#
# ── Tool Tier Registry (Constitution 4.7) ──────────────────────────────
# Tier assignments are declarative in config/tools.yaml and loaded at gateway start.
# Override registry path with env var AUTONOETIC_TOOL_TIER_REGISTRY_PATH.
# Schema:
#   version: 1
#   default_tier: specialized
#   rules:
#     - prefix: content_
#       tier: core

# ── Cross-cutting Routing Concerns ────────────────────────────────────
# Agent overrides and approval gates. Model definitions live in llm_presets.
llm_routing:
  agent_overrides:
    planner.default:
      min_tier: standard                      # economy | standard | premium
  approval_gates:
    premium_model_first_use: false            # require approval before first premium model use
    budget_threshold_crossed: 0.75            # 0.0–1.0, require approval when budget exceeds this

# ── LLM Presets ───────────────────────────────────────────────────────
# Unified registry: fixed presets (concrete provider/model) and routing
# presets (dynamic selection from fixed presets at call time).
#
# tier: economy | standard | premium
# strategy: disabled | deterministic | classifier | hybrid
# on_exceeded (prompt_budget): warn | trim_history | demote_tools | fail
#
# For local OpenAI-compatible servers (LM Studio, Ollama, etc.), set base_url:
#
#   local:
#     provider: "lmstudio"
#     model: "unsloth/qwen3.5-35b-a3bi@q4_k_xl"
#     base_url: "http://192.168.1.20:1234/v1"
#     tier: economy
#
llm_presets:
  # ── Fixed presets: concrete model definitions ───────────────────────
  haiku:
    provider: "anthropic"
    model: "claude-haiku-3-20250307"
    tier: economy
    cost:
      input_per_million: 0.25
      output_per_million: 1.25

  sonnet:
    provider: "anthropic"
    model: "claude-sonnet-4-20250514"
    tier: standard
    cost:
      input_per_million: 3.0
      output_per_million: 15.0

  opus:
    provider: "anthropic"
    model: "claude-opus-4-20250514"
    tier: premium
    cost:
      input_per_million: 15.0
      output_per_million: 75.0
    # thinking:
    #   effort: high
    #   budget_tokens: 8192

  # ── Routing presets: select from fixed presets at call time ─────────
  smart:
    routing:
      strategy: hybrid
      models: [opus, sonnet, haiku]           # fixed preset names
      classifier_preset: haiku                # fixed preset for classification
      deterministic:
        max_tier: premium                     # economy | standard | premium
        budget_downgrade_threshold: 0.8       # 0.0–1.0
        enable_fallback_chain: true
      classifier:
        timeout_secs: 2
        skip_threshold: 0.95                  # 0.0–1.0
      hybrid:
        ambiguity_threshold: 0.5              # 0.0–1.0

  budget:
    routing:
      strategy: deterministic
      models: [sonnet, haiku]
      deterministic:
        max_tier: standard                    # economy | standard | premium
        budget_downgrade_threshold: 0.6
        enable_fallback_chain: true

  # ── Legacy presets (backward compatible, no routing) ────────────────
  agentic:
    provider: "openrouter"
    model: "minimax/minimax-m2.7"
    temperature: 0.2

  coding:
    provider: "openrouter"
    model: "minimax/minimax-m2.7"
    temperature: 0.1

  research:
    provider: "openrouter"
    model: "minimax/minimax-m2.7"
    temperature: 0.3

  fallback:
    provider: "openai"
    model: "gpt-4o"
    temperature: 0.2

  gemma4_31b:
    provider: "lmstudio"
    model: "gemma-4-31B-it-Q5_K_M"
    temperature: 1.0
    base_url: "http://192.168.1.20:8080/v1/chat/completions"
    thinking:
      effort: medium

  qwen36_35_a3b:
    provider: "lmstudio"
    model: "Qwen3.6-35B-A3B-GGUF"
    temperature: 1.0
    base_url: "http://192.168.1.20:8080/v1/chat/completions"
    thinking:
      effort: medium

  elephant:
    provider: "openrouter"
    model: "openrouter/elephant-alpha"
    temperature: 1.0


llm_preset_mapping:
  planner: gemma4_31b             # routed
  coder: gemma4_31b               # routed
  executor: gemma4_31b            # routed
  researcher: gemma4_31b         # fixed
  debugger: gemma4_31b            # fixed
  evaluator: gemma4_31b          # routed
  architect: gemma4_31b            # fixed
  specialized_builder: gemma4_31b
  packager: gemma4_31b
  registration: gemma4_31b        # credential onboarding flow
  agent-factory: gemma4_31b       # agent creation pipeline orchestration
  discovery: gemma4_31b          # semantic reasoning over agent descriptions
  default: gemma4_31b


# ── Template → Preset Mapping ────────────────────────────────────────
# Used during 'agent bootstrap' and 'agent init --template <name>'.
# Values can be fixed preset names or routing preset names.
# llm_preset_mapping:
#   planner: agentic             # routed
#   coder: coding               # routed
#   executor: coding            # routed
#   researcher: research         # fixed
#   debugger: coding            # fixed
#   evaluator: coding          # routed
#   architect: coding            # fixed
#   specialized_builder: agentic
#   packager: agentic
#   registration: agentic        # credential onboarding flow
#   agent-factory: agentic       # agent creation pipeline orchestration
#   discovery: research          # semantic reasoning over agent descriptions
#   default: fallback

# ── Context Compression ──────────────────────────────────────────────
# Summarizes old conversation turns when approaching context limits.
# context_compression:
#   enabled: false
#   llm_preset: haiku
#   threshold_pct: 60.0
#   recent_turns_to_keep: 3
#   max_summary_tokens: 500
#   min_turns_between_compression: 3

# ── System Agents ─────────────────────────────────────────────────────
# Declared background agents that the gateway reconciles on startup.
# Each entry gets its cron job created automatically if missing.
# Control manually: autonoetic gateway system-agents list|bootstrap|run
#
# system_agents:
#   - agent_id: evolution-orchestrator.default
#     schedule: "0 */4 * * *"
#     message: "Run evolution analysis cycle"
#     enabled: true
