[package]
name = "autonoetic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `test-utils`: `reset_constitution_runtime_for_tests` for CLI unit tests that bootstrap multiple temp workspaces.
autonoetic-gateway = { workspace = true, features = ["test-utils"] }
autonoetic-mcp.workspace = true
autonoetic-types.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
reqwest = { version = "0.13.2", features = ["json"] }
async-trait = "0.1.89"
dirs = "6.0.0"
uuid = { version = "1", features = ["v4"] }
regex = "1"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
pulldown-cmark = "0.12"
crossterm = "0.28"
unicode-width = "0.2"
arboard = "3.4"
rpassword = "7.3"
chrono = "0.4"
tempfile = "3.26.0"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
secrecy = "0.10.3"
serial_test = "3"
