[workspace]
members = [
    "autonoetic",
    "autonoetic-gateway",
    "autonoetic-types",
    "autonoetic-ofp",
    "autonoetic-mcp",
    "xtask"
]
resolver = "2"

# Build-performance tuning (#919, #920). With 239 gateway integration-test
# binaries, full `debug = 2` produces ~250 MB per test binary (~60 GB of
# linker output across the suite). Line tables keep backtraces at file:line
# resolution while cutting binaries ~3.5×; only debugger variable inspection
# degrades, which the test loop does not rely on.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
autonoetic-types = { path = "autonoetic-types" }
autonoetic-gateway = { path = "autonoetic-gateway" }
autonoetic-ofp = { path = "autonoetic-ofp" }
autonoetic-mcp = { path = "autonoetic-mcp" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Archive/compression
tar = "0.4"
zstd = "0.13"
